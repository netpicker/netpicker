# Default values for netpicker chart
# This is a YAML-formatted file.

global:
  imageRegistry: "docker.io"
  imagePullSecrets: []
  # The storage class for every volume that sets no class of its own.
  # Longhorn supplies ReadWriteOnce block volumes and ReadWriteMany shared
  # volumes from this one class. Install Longhorn before you install this
  # chart.
  # Ceph and NetApp Trident serve the two access modes from two different
  # classes. On those systems, name the block class here and name the file
  # class in persistence.storageClass. See the README.
  storageClass: "longhorn"
  secretConfig: "default"

# Storage class configuration
# Longhorn installs its own storage class, so this chart makes none.
# Set enabled to true only if you replace Longhorn with a local storage
# provisioner. Local storage gives no ReadWriteMany volumes. The shared
# volumes then work on one node only.
storageClass:
  enabled: false
  name: "local-storage"
  isDefault: false
  # Using local path provisioner for local filesystem storage
  # Other options for local storage:
  # - k8s.io/minikube-hostpath for Minikube
  # - rancher.io/local-path for Rancher's Local Path Provisioner
  # - openebs.io/local for OpenEBS Local PV
  provisioner: "rancher.io/local-path"
  # Parameters specific to the local path provisioner
  parameters:
    # No specific parameters needed for basic local-path setup
  # WaitForFirstConsumer ensures the PV is created on the node where the pod is scheduled
  volumeBindingMode: "WaitForFirstConsumer"
  reclaimPolicy: "Delete"
  allowVolumeExpansion: true
  mountOptions:
    - noatime
    - nodiratime

images:
  api:
    repository: netpicker/api
    tag: "2.7.6"
    pullPolicy: IfNotPresent
  db:
    repository: netpicker/db
    tag: "latest"
    pullPolicy: IfNotPresent
  redis:
    repository: redis
    tag: "7-alpine3.21"
    pullPolicy: IfNotPresent
  gitd:
    repository: netpicker/gitd
    tag: "2.7.6"
    pullPolicy: IfNotPresent
  gitdctrl:
    repository: netpicker/gitdctrl
    tag: "2.7.6"
    pullPolicy: IfNotPresent
  swagger:
    repository: swaggerapi/swagger-ui
    tag: "latest"
    pullPolicy: IfNotPresent
  frontend:
    repository: netpicker/tester-frontend
    tag: "2.7.6"
    pullPolicy: IfNotPresent
  kibbitzer:
    repository: netpicker/kibbitzer
    tag: "2.7.6"
    pullPolicy: IfNotPresent
  agent:
    repository: netpicker/agent
    tag: "2.7.6"
    pullPolicy: IfNotPresent
  syslogng:
    repository: netpicker/syslog-ng
    tag: "2.7.6"
    pullPolicy: IfNotPresent
  transferium:
    repository: netpicker/transferium
    tag: "latest"
    pullPolicy: IfNotPresent

# Common environment variables
tagParams:
  xslow:
    timeout: 120
    conn_timeout: 30
    read_timeout_override: 30
    fast_cli: false
    keepalive: 5
  slow_cli:
    fast_cli: false

# Database configuration
db:
  enabled: true
  postgresPassword: "s3rgts0p!"
  persistence:
    enabled: true
    size: 8Gi
    # PostgreSQL is a single writer, so this volume is never shared.
    # Keep ReadWriteOnce. Do not put the database on an RWX file share
    # such as NFS, because PostgreSQL needs correct file locking.
    accessMode: "ReadWriteOnce"
    # Storage class for this volume. Empty means global.storageClass.
    storageClass: ""
  service:
    type: ClusterIP
    port: 5432
  resources: {}

# API configuration
api:
  enabled: true
  alembicVersion: "78239c9184d4"
  dbPassword: netpicker
  cliProxyHost: "agent"
  logLevel: "INFO"
  uvicornRootPath: "/"
  # Git actor settings (optional)
  # gitAuthorName: "netpicker"
  # gitAuthorEmail: "support@netpicker.io"
  # gitCommitterName: "netpicker"
  # gitCommitterEmail: "support@netpicker.io"
  service:
    type: ClusterIP
    port: 8000
  resources: {}
  persistence:
    enabled: true
    size: 20Gi

# Database migration configuration
dbMigration:
  enabled: true
  resources: {}

# Celery configuration
celery:
  enabled: true
  logLevel: "INFO"
  resources: {}

# Redis configuration
redis:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
    # Redis is a single writer, so this volume is never shared.
    accessMode: "ReadWriteOnce"
    # Storage class for this volume. Empty means global.storageClass.
    storageClass: ""
  service:
    type: ClusterIP
    port: 6379
  resources: {}
  saveSettings: "60 1"
  logLevel: "warning"

# Git daemon configuration
gitd:
  enabled: true
  persistence:
    enabled: true
    size: 20Gi
  service:
    type: NodePort
    port: 9418
    nodePort: 30918 # Optional: specify a specific NodePort (30000-32767 range)
  resources: {}

# Git daemon control configuration
gitdctrl:
  enabled: true
  service:
    type: ClusterIP
    port: 9419
  resources: {}

# Swagger UI configuration
swagger:
  enabled: true
  service:
    type: ClusterIP
    port: 8080
  resources: {}

# Frontend configuration
frontend:
  enabled: true
  service:
    type: ClusterIP
    port: 80
  resources: {}

# Kibbitzer configuration
kibbitzer:
  enabled: true
  logLevel: "DEBUG"
  apiUrl: "http://api:8000"
  apiTimeout: 30
  privilegedPlatforms: "gigamon_gigavue arista_eos"
  showRunCommands:
    corvil: "show config"
    gigamon: "show running"
    meinberg: "generate_config_backup && cat /var/tmp/lantime_config.backup"
    mikrotik_routeros: "export"
    nokia_srl: "info"
    paloalto_panos: "show config running"
  tagShowRunCommands:
    mikrotik_routeros_v7: "export show-sensitive"
  service:
    type: ClusterIP
  resources: {}
  # The kibbitzer mounts the shared secrets volume. See persistence.secret.

# Agent configuration
agent:
  enabled: true
  cliProxyAddr: "0.0.0.0"
  sharedSshTtl: 180
  service:
    type: ClusterIP
    portVault: 8765
    portProxy: 9876
  resources: {}
  # The agent mounts the shared secrets volume. See persistence.secret.

# Syslog-ng configuration
syslogng:
  enabled: true
  service:
    type: ClusterIP
    udpPort: 514
    tcpPort: 601
    tlsPort: 6614
  persistence:
    enabled: true
    size: 1Gi
    # The syslog-ng server is a single writer, so this volume is never shared.
    accessMode: "ReadWriteOnce"
    # Storage class for this volume. Empty means global.storageClass.
    storageClass: ""
  resources: {}

# Transferium configuration (optional FTP/TFTP server)
transferium:
  enabled: false
  ftpPasvAddress: "" # Set to the IP where this runs
  ftpPasvPorts: "31000-31015"
  service:
    type: NodePort
  resources: {}

# Persistence configuration for shared volumes
persistence:
  # Access mode for the volumes that more than one pod mounts.
  # The db, redis and syslog-ng volumes have their own access mode.
  #
  # ReadWriteOnce is the default. A ReadWriteOnce volume attaches to one node,
  # but all the pods on that node can mount it. All the pods that share a
  # volume must therefore run on the same node. A pod on another node stays in
  # the Pending state.
  #
  # Set ReadWriteMany to spread these pods over more than one node. The storage
  # system must supply that mode. Longhorn starts an NFS share manager pod for
  # each ReadWriteMany volume, and every node then needs an NFS client. Ceph
  # and NetApp Trident serve that mode from a different storage class, so also
  # set persistence.storageClass. See the README.
  accessMode: "ReadWriteOnce"
  # Storage class for all the shared volumes: dc-vol, transferium, the api
  # policy data, the gitd repositories and the secrets. Empty means
  # global.storageClass. Set this only if the ReadWriteMany volumes need
  # another class than the ReadWriteOnce volumes, as on Ceph or Trident.
  storageClass: ""
  dcVol:
    enabled: true
    size: 1Gi
  transferium:
    enabled: true
    size: 1Gi
  # The agent and the kibbitzer share this volume at /run/secrets.
  secret:
    enabled: true
    size: 1Gi
