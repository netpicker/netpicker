{{- if .Values.celery.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netpicker.committer.fullname" . }}
  labels:
    {{- include "netpicker.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery
    netpicker.io: service
    service.netpicker.io: celery
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "netpicker.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: committer
  template:
    metadata:
      labels:
        {{- include "netpicker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: committer
        netpicker.io: service
        service.netpicker.io: committer
    spec:
      enableServiceLinks: false
      {{- include "netpicker.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- if .Values.volumePermissions.enabled }}
        {{- include "netpicker.init-perms" (dict "context" . "paths" (list "policy-data")) | nindent 8 }}
        {{- end }}
        {{- include "netpicker.wait-for-db" . | nindent 8 }}
      containers:
        - name: celery
          image: {{ include "netpicker.image" (dict "global" .Values.global "image" .Values.images.api) }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["/run-celery"]
          env:
            {{ include "netpicker.redis" . | nindent 12 }}
            {{ include "netpicker.dbConfig" . | nindent 12 }}
            - name: CELERY_QUEUES
              value: config_commit
            - name: WITHOUT_BEAT
              value: "1"
            - name: alembic_version
              value: {{ .Values.api.alembicVersion | quote }}
            - name: CLI_PROXY_HOST
              value: {{ .Values.api.cliProxyHost | quote }}
            - name: GIT_REPO_MANAGER
              value: '["{{ include "netpicker.gitd.fullname" . }}", {{ .Values.gitdctrl.service.port }}]'
            - name: LOG_LEVEL
              value: {{ .Values.celery.logLevel | quote }}
            - name: UVICORN_ROOT_PATH
              value: {{ .Values.api.uvicornRootPath | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretConfig | default "default" }}
                  key: JWT_SECRET
            - name: S3_ACCESS_KEY_ID
              value: {{ .Values.minio.root_user | quote }}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretConfig | default "default" }}
                  key: MINIO_ROOT_PASSWORD

          volumeMounts:
            - name: policy-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/celery
                - inspect
                - ping
                - --timeout=3
            initialDelaySeconds: 15
            periodSeconds: 120
            timeoutSeconds: 12
          resources:
            {{- toYaml .Values.celery.resources | nindent 12 }}
      volumes:
        - name: policy-data
          persistentVolumeClaim:
            claimName: {{ include "netpicker.api.fullname" . }}-data
      securityContext:
        fsGroup: 911
{{- end }}
